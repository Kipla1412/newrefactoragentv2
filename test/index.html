<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 95%;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .context-row {
            margin-bottom: 25px;
        }

        .context-row label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        .context-row input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        .context-row input::placeholder {
            color: #64748b;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .start {
            background: #22c55e;
            color: white;
        }

        .stop {
            background: #ef4444;
            color: white;
        }

        .box {
            background: #334155;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .box h3 {
            margin-bottom: 10px;
        }

        .content {
            min-height: 80px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .mic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 20px auto;
            background: #475569;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }

        .recording {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>🎤 AI Voice Agent</h1>

            <div class="status">
                Status: <span id="status">Disconnected</span>
            </div>

            <div class="mic" id="mic">🎙️</div>

            <div class="context-row">
                <label for="patientContext">Patient context (optional — sent as the <code>patient_context</code> query
                    param)</label>
                <input id="patientContext" type="text" placeholder="name = Jane Doe, age = 34" />
            </div>

            <div class="controls">
                <button class="start" onclick="startVoice()">Start</button>
                <button class="stop" onclick="stopVoice()">Stop</button>
            </div>

            <div class="box">
                <h3>User Transcript</h3>
                <div id="transcript" class="content"></div>
            </div>

            <div class="box">
                <h3>Assistant Response</h3>
                <div id="assistant" class="content"></div>
            </div>
        </div>
    </div>

        let processor = null;
        let source = null;
        let mediaStream = null;
        let conversationEnded = false;

        let nextStartTime = 0;

        const statusEl = document.getElementById("status");
        const transcriptEl = document.getElementById("transcript");
        const assistantEl = document.getElementById("assistant");
        const micEl = document.getElementById("mic");

        function endConversation() {
            if (conversationEnded) return;
            conversationEnded = true;
            statusEl.innerText = "Conversation ended";
            micEl.classList.remove("recording");
            if (processor) processor.disconnect();
            if (source) source.disconnect();
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext && audioContext.state !== "closed") {
                audioContext.close();
            }
        }

            if (contextValue) {

            }

            ws.onopen = async () => {
                console.log("Connected to server");
                statusEl.innerText = "Connected";
                micEl.classList.add("recording");

                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext({ sampleRate: 16000 });

                source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (event) => {
                    const input = event.inputBuffer.getChannelData(0);
                    const pcm = new Int16Array(input.length);

                    for (let i = 0; i < input.length; i++) {
                        let s = Math.max(-1, Math.min(1, input[i]));
                        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }

                    if (!conversationEnded && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(pcm.buffer);
                    }
                };
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "status") {
                    const statusText = {
                        "greeting": "Speaking greeting...",
                        "ready": "Ready — you can speak",
                        "thinking": "Thinking...",
                        "end": "Conversation ended",
                    }[data.status] || data.status;
                    statusEl.innerText = statusText;

                    if (data.status === "ready") {
                        micEl.classList.add("recording");
                    } else if (data.status === "thinking") {
                        micEl.classList.remove("recording");
                    } else if (data.status === "end") {
                        endConversation();
                    }
                }

                if (data.type === "status_end") {
                    endConversation();
                }

                if (data.type === "transcript") {
                    transcriptEl.innerHTML = data.text;
                }

                if (data.type === "text") {
                    assistantEl.innerHTML += data.text;
                }

                if (data.type === "audio") {
                    if (data.audio && typeof data.audio === "string" && data.audio.trim().length > 0) {
                        // 🌟 Direct Base64 to ArrayBuffer streaming processor injection
                        playStreamingBuffer(data.audio);
                    }
                }

                if (data.type === "error") {
                    console.error(data.message);
                }
            };

            ws.onerror = (error) => {
                console.log("WebSocket Error: ", error);
            };

            ws.onclose = () => {
                console.log("Disconnected from server");
                stopVoice();
            };
        }

        // 🌟 New Linear ArrayBuffer Scheduler Engine
        function playStreamingBuffer(base64Data) {
            if (!playbackContext) return;

            // Strip incoming WAV structural headers from middle chunks if present
            let cleanBase64 = base64Data;
            if (cleanBase64.startsWith("UklGR")) {
                // Contains RIFF WAV text marker header block, bypass bytes 0-44
                const rawBinary = atob(cleanBase64);
                if (rawBinary.length > 44) {
                    const headerlessBinary = rawBinary.substring(44);
                    cleanBase64 = btoa(headerlessBinary);
                }
            }

            // Convert base64 straight to standard binary array buffer context
            const binaryString = window.atob(cleanBase64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            // Parse continuous PCM 16-bit Mono data frames directly
            const rawPCM = new Int16Array(bytes.buffer);
            const bufferLength = rawPCM.length;

            if (bufferLength === 0) return;

            // Build native hardware audio data buffers dynamically
            const audioBuffer = playbackContext.createBuffer(1, bufferLength, 24000);
            const channelData = audioBuffer.getChannelData(0);

            for (let i = 0; i < bufferLength; i++) {
                channelData[i] = rawPCM[i] / 32768.0;
            }

            // Frame timestamp synchronization scheduler
            const bufferSource = playbackContext.createBufferSource();
            bufferSource.buffer = audioBuffer;
            bufferSource.connect(playbackContext.destination);

            const currentTime = playbackContext.currentTime;
            if (nextStartTime < currentTime) {
                nextStartTime = currentTime;
            }

            bufferSource.start(nextStartTime);
            nextStartTime += audioBuffer.duration;
        }

        function stopVoice() {
            if (processor) processor.disconnect();
            if (source) source.disconnect();
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext && audioContext.state !== "closed") {
                audioContext.close();
            }
            if (playbackContext && playbackContext.state !== "closed") {
                playbackContext.close();
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }

            ws = null;
            playbackContext = null;
            micEl.classList.remove("recording");
            statusEl.innerText = "Disconnected";
        }
