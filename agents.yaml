# Application-level agent configuration.
#
# Configuration selects; registries resolve; the factory composes.
#
# The `models` section defines logical model entries resolved by the
# ModelRegistry. The `agents` section only lists which agents are
# enabled — each agent's model/prompt/tools references live in that
# agent's own customagents/<agent>/config.yaml.

models:

  clinical_model:
    provider: openai
    name: gpt-4.1
    temperature: 0.1

  fast_model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2

  # Logical models used by the ModelRouter (clinical traffic).
  # `litellm_model` is the LiteLLM model string; when omitted it is built
  # from "<provider>/<name>".
  fast:
    provider: openai
    name: gpt-4o-mini
    litellm_model: openai/gpt-4o-mini
    temperature: 0.3

  reasoning:
    provider: anthropic
    name: claude-3-5-sonnet-20241022
    litellm_model: anthropic/claude-3-5-sonnet-20241022
    temperature: 0.2

  # Fallback models — tried in the order given by LLM_FALLBACK_MODELS when
  # the primary model fails. Gemini uses GEMINI_API_KEY; Ollama uses
  # OLLAMA_API_BASE / OLLAMA_BASE_URL.
  gemini:
    provider: gemini
    name: gemini-2.0-flash
    litellm_model: gemini/gemini-2.0-flash
    temperature: 0.2

  ollama:
    provider: ollama
    name: llama3.2
    litellm_model: ollama/llama3.2
    temperature: 0.3

  # Vision-capable model used for PDF OCR (config.vision_model_name).
  # gpt-4o-mini is multimodal and cheap, and authenticates with the
  # framework API_KEY / BASE_URL. Point VISION_MODEL_NAME at this logical
  # name (or at any other registered vision model).
  # Local alternative: provider ollama / litellm_model ollama/medgemma-multi:latest
  vision:
    provider: openai
    name: gpt-4o-mini
    litellm_model: openai/gpt-4o-mini
    temperature: 0.0

agents:

  doc:                 { enabled: true }
  soap:                { enabled: true }
  assessment:          { enabled: true }
  clinical_extraction: { enabled: true }
  consult:             { enabled: true }
  intake:              { enabled: true }
  ehr:                 { enabled: true }
  demographics:        { enabled: true }
  medical:             { enabled: true }
  diarize:             { enabled: true }
  voice_intake:        { enabled: true }
  voice_consult:       { enabled: true }
  document_retrieval:  { enabled: true }
  pdf_chat:            { enabled: true }

# Evaluation. One engine serves real-time and offline evaluation; the only
# difference is where the evaluation event came from.
#
# `metrics` are deterministic rules: always run, no LLM, no flake.
# `llm_metrics` are MLflow's DeepEval scorers, judged by an LLM. They are only
# registered as trustworthy when `llm.allow_external_calls` is true — this
# framework handles patient data, so that is an explicit operator decision.
# With the flag off the metric still appears in the report as "skipped" with the
# reason, so a gap is visible rather than silent.
#
# Metric names come from evaluation/agents/*/rules.py (deterministic) and
# evaluation/adapters/mlflow_scorer/spec.py (LLM).
evaluation:

  enabled: true

  realtime:
    enabled: false          # live per-turn evaluation; off until opted in
    asynchronous: true
    max_concurrency: 2
    timeout: 60

  offline:
    enabled: true

  common_metrics: []

  agents:

    intake:
      # Per-turn rules: these judge how the agent *behaves* mid-intake, so they
      # must run on every turn.
      metrics:
        - medical_boundary_compliance
        - no_repeated_questions
      # End-of-intake outcome rules: these only apply when intake is actually
      # finishing. Scoring them on a mid-intake turn makes the agent "fail" for
      # not ending early, which inverts the expectation. They are selected per
      # case via each test case's critical_checks instead. See
      # evaluation/agents/intake/metrics.py (END_OF_INTAKE_METRICS).
      end_of_intake_metrics:
        - emergency_compliance
        - intake_completion
      # Answer Relevancy under-scores replies that ask a clarifying question,
      # which is most of intake. Left off deliberately.
      llm_metrics: []

    pdf_chat:
      metrics: []
      llm_metrics:
        - faithfulness

  llm:
    allow_external_calls: true
    # Judge model URI. null -> MLFLOW_GENAI_JUDGE_DEFAULT_MODEL, else
    # openai:/gpt-4.1-mini. Requires provider-native credentials such as
    # OPENAI_API_KEY; the framework's API_KEY/BASE_URL are not used by MLflow.
    model_uri: null

