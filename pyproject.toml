[project]
name = "refactoragent"
version = "0.1.0"
description = "Multi-agent clinical voice system with streaming STT, diarization, and MLflow tracking"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "mlflow>=2.0.0",
    "psutil>=5.8.0",
    "pydantic",
    "tomli",
    "PyYAML",
    "platformdirs",
    "openai",
    "litellm[proxy]>=1.40.0",
    "ddgs",
    "tiktoken",
    "fastapi",
    "uvicorn",
    "reportlab",
    "requests",
    "websockets",
    "setuptools",
    "httpx",
    "fastmcp",
    "rich",
    "click",
    "PyJWT>=2.0.0",
    "soundfile",
    "sarvamai",
    "neo4j",
    "opensearch-py>=3.2.0",
    "pypdf",
    "pymupdf",
    "deepeval>=4.3.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Warnings are visible by default, so a new one from this codebase stands out.
# The filters below silence *third-party* deprecations only, each pinned to the
# library that emits it: a blanket "ignore::DeprecationWarning" would hide our own.
filterwarnings = [
    # deepeval still calls asyncio.iscoroutinefunction, which Python 3.14
    # deprecated and 3.16 removes. Nothing we can fix from here.
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning:deepeval.*",
    # anyio's pytest plugin predates pytest 10's CallSpec rename.
    "ignore:_pytest\\.python\\.CallSpec2 has been renamed to CallSpec:_pytest.warning_types.PytestRemovedIn10Warning",
]

# pytest-asyncio asks for this to be explicit. "function" is its own default, so
# setting it changes no behaviour — it just removes the startup notice. This
# suite drives async code with asyncio.run, so no asyncio_mode is needed.
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["*"]

# Skill instructions are data, not importable modules.
[tool.setuptools.package-data]
skills = ["library/**/*.md"]
